<!doctype html>
<html lang="en-IN" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Before paint: mark JS as available, and apply the saved theme (light unless the visitor chose dark). Keep in sync with src/lib/theme.ts. -->
    <script>(function (d) { d.className = d.className.replace('no-js', 'js'); var t; try { t = localStorage.getItem('ft-theme'); } catch (e) {} if (t !== 'dark') t = 'light'; d.setAttribute('data-theme', t); if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1622'); })(document.documentElement);</script>
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
